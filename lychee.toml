# Lychee link checker configuration
# Docs: https://github.com/lycheeverse/lychee

# Treat these HTTP statuses as success (429 = rate-limited, not broken).
accept = [200, 206, 429]

# Network behaviour
max_retries = 3
timeout = 20
max_concurrency = 8

# Use a realistic user agent so well-behaved hosts do not reject the bot.
user_agent = "Mozilla/5.0 (compatible; lychee link checker)"

# Do not crawl dependency or build output.
exclude_path = [
  "node_modules",
  "dist",
  "build",
]

# Excluded links (justified). Verify these manually before submission and
# record the justification + manual verification in reports/week2/README.md.
exclude = [
  # Localhost / dev-only URLs that are not reachable from CI.
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  # Figma files (design / proto / board) return 403 to anonymous clients even
  # with public view sharing enabled; verified manually in the browser.
  "^https://www\\.figma\\.com/",
  # MVP v0 deployment on the Innopolis VM: private IP + self-signed cert, not
  # reachable from GitHub CI; verified manually on the Innopolis network.
  "^https://10\\.93\\.26\\.180",
  # Published at Sprint 3 close (Assignment 5): the hosted MkDocs docs site and
  # the v0.3.0 release tag are linked from the docs ahead of publication.
  # TODO remove both exclusions once the docs site is deployed and v0.3.0 is
  # tagged, so lychee guards them like every other link.
  "^https://scaredofthesix\\.github\\.io/voice-games/docs/",
  "^https://github\\.com/scaredofthesix/voice-games/releases/tag/v0\\.3\\.0",
]

# Check links inside fenced code blocks too? Keep code-block URLs out to avoid
# flagging illustrative examples.
include_verbatim = false
