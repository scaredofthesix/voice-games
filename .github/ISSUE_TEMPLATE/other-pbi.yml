name: Other PBI
description: A non-user-story Product Backlog item (technical, infrastructure, research, design, testing, deployment, or maintained product/workflow documentation).
title: "<short summary>"
labels: ["pbi"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Technical / implementation
        - Infrastructure
        - Research / spike
        - Design
        - Testing
        - Deployment / release
        - Documentation (product or workflow)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the work and the expected outcome? Link any parent user story (e.g. "Supports US-04").
    validations:
      required: true
  - type: dropdown
    id: moscow
    attributes:
      label: MoSCoW priority
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Specific, observable, testable. Required before the PBI is implemented, reviewed, or verified.
      value: |
        - [ ] …
        - [ ] …
        - [ ] …
    validations:
      required: false
  - type: input
    id: deliverable
    attributes:
      label: Explicit deliverable / evidence
      description: Only needed when the evidence is not an obvious linked PR (e.g. a design artifact, API spec, deployment artifact, doc).
      placeholder: Linked PR (default)
  - type: input
    id: implementer
    attributes:
      label: Implementer
      placeholder: "@username"
  - type: input
    id: reviewer
    attributes:
      label: Reviewer (different from implementer)
      placeholder: "@username"
  - type: input
    id: story-points
    attributes:
      label: Story Points
      description: Modified Fibonacci (1, 2, 3, 5, 8, 13, 20, 40, 100).
      placeholder: "2"
