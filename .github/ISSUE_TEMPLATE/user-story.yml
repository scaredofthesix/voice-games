name: User Story
description: A product requirement expressed from a user's perspective (As a … I want … so that …).
title: "US-XXX: <short summary>"
labels: ["user-story", "pbi"]
body:
  - type: input
    id: stable-id
    attributes:
      label: Stable user-story ID
      description: Permanent ID (US-01, US-02, …). Never change, reuse, or reassign it. Keep it in the issue title too.
      placeholder: US-01
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: User-story statement
      description: Full statement in the canonical form.
      value: |
        As a <role/persona>,
        I want <desired action>,
        so that <expected value>.
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Role / persona
      options:
        - Child learner
        - Parent
        - Teacher
        - Other
    validations:
      required: true
  - type: dropdown
    id: moscow
    attributes:
      label: MoSCoW priority
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have
    validations:
      required: true
  - type: dropdown
    id: requirement-status
    attributes:
      label: Requirement status
      options:
        - Active
        - Removed
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Specific, observable, testable. Given/When/Then recommended. Required before the story is Ready for a Sprint or part of an MVP version.
      value: |
        - [ ] Given … When … Then …
        - [ ] Given … When … Then …
        - [ ] Given … When … Then …
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes, constraints, assumptions, open questions
      description: Carry over context from refinement and customer reviews.
    validations:
      required: false
  - type: input
    id: implementer
    attributes:
      label: Implementer
      description: GitHub @handle responsible for the work (required when selected for a Sprint).
      placeholder: "@username"
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: A different GitHub @handle who reviews and confirms completion (required when selected for a Sprint).
      placeholder: "@username"
  - type: input
    id: story-points
    attributes:
      label: Story Points
      description: Modified Fibonacci (1, 2, 3, 5, 8, 13, 20, 40, 100).
      placeholder: "3"
