name: Course Task
description: Work whose primary purpose is course reporting, grading evidence, submission packaging, or course administration. NOT a PBI; does not count toward backlog-size minimums.
title: "<short summary>"
labels: ["course-task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What course-administration / reporting work needs to be done?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Expected evidence or deliverable
      description: What artifact proves this task is complete (e.g. a report file, a screenshot, a submitted PDF)?
    validations:
      required: true
  - type: input
    id: assignee
    attributes:
      label: Owner
      placeholder: "@username"
