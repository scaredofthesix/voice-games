<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1025" viewBox="0 0 2048 1025" role="img" aria-labelledby="title desc">
  <title id="title">Location of the Progress button in the Voice Games Hub</title>
  <desc id="desc">The Voice Games Hub with the Progress button highlighted in the top-right corner.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ef4444"/>
    </marker>
  </defs>
  <image href="hub.png" x="0" y="0" width="2048" height="1025"/>
  <rect x="1818" y="22" width="164" height="64" rx="22" fill="none" stroke="#ef4444" stroke-width="12" filter="url(#shadow)"/>
  <path d="M 1640 190 C 1730 170, 1800 125, 1888 82" fill="none" stroke="#ef4444" stroke-width="14" stroke-linecap="round" marker-end="url(#arrowhead)" filter="url(#shadow)"/>
  <rect x="1420" y="170" width="300" height="82" rx="20" fill="#fff7ed" stroke="#0f172a" stroke-width="7" filter="url(#shadow)"/>
  <text x="1570" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">PROGRESS</text>
  <text x="1570" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">ПРОГРЕСС</text>
</svg>
